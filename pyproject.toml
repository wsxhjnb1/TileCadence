[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilecadence"
version = "0.1.0"
description = "Constraint-guided shared-memory lifetimes for FlashAttention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ortools==9.15.6755"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["tilecadence"]

[tool.setuptools.package-data]
tilecadence = ["cuda/*/*.cu", "cuda/*/*.cuh", "cuda/*/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
